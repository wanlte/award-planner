apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: award-planner
spec:
  title: 任务奖励规划器
  url: ''
  gitRepo: ''
  author: ''
  description: 带奖励金机制的任务规划器：任务分难度、奖励按难度建议、完成后逐笔累加进攒钱目标
  readme: ''
  icon: ''
  templateType: inline
  locale: en
  categories: []
  defaults:
    app_name:
      type: string
      value: award-planner-${{ random(8) }}
    app_host:
      type: string
      value: planner-${{ random(8) }}
    app_password:
      type: string
      value: ${{ random(32) }}
  inputs: {}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-planner
  annotations:
    originImageName: harbor.bja.sealos.run/ns-ajtyjv5w/award-planner/planner:20261108-034720
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-planner
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-planner
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}-planner
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-planner
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-planner
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      imagePullSecrets:
      - name: harbor-registry-cred-hp-ns-ajtyjv5w
      containers:
      - name: ${{ defaults.app_name }}-planner
        image: harbor.bja.sealos.run/ns-ajtyjv5w/award-planner/planner:20261108-034720
        imagePullPolicy: IfNotPresent
        env:
        - name: PORT
          value: '3210'
        - name: PLANNER_DATA_DIR
          value: /data
        - name: APP_PASSWORD
          value: ${{ defaults.app_password }}
        resources:
          requests:
            cpu: 20m
            memory: 25Mi
          limits:
            cpu: 200m
            memory: 256Mi
        ports:
        - containerPort: 3210
          name: http
        volumeMounts:
        - name: vn-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      annotations:
        path: /data
        value: '1'
      name: vn-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-planner
  labels:
    app: ${{ defaults.app_name }}-planner
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-planner
spec:
  ports:
  - name: http
    port: 3210
    targetPort: 3210
    protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-planner
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-planner
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-planner
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
spec:
  rules:
  - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: ${{ defaults.app_name }}-planner
            port:
              number: 3210
  tls:
  - hosts:
    - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}-planner
  labels:
    app: ${{ defaults.app_name }}-planner
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-planner
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: ''
  name: 任务奖励规划器
  type: link
