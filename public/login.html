<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="奖励规划器">
<meta name="robots" content="noindex">
<title>登录 · 任务奖励规划器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2311161f'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2334d399' stroke-width='2.4'/%3E%3Cpath d='M16 11v10M13 14.2h6M13 18h6' stroke='%2334d399' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-body">
<div class="bg-glow" aria-hidden="true"></div>

<main class="auth-wrap">
  <form class="auth-card" id="loginForm" novalidate>
    <div class="auth-brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="7.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v8M9.4 10.4h5.2M9.4 13.6h5.2" stroke="currentColor" stroke-width="1.8"/></svg>
      </div>
      <span class="auth-eyebrow">奖励金账本</span>
    </div>

    <h1 class="auth-title">任务奖励规划器</h1>
    <p class="auth-sub">完成任务 · 领取奖励 · 攒到目标</p>

    <label class="auth-label" for="password">访问密码</label>
    <div class="auth-input">
      <svg class="auth-lock" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <rect x="4.5" y="10" width="15" height="10" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M8 10V7.4a4 4 0 0 1 8 0V10" fill="none" stroke="currentColor" stroke-width="1.7"/>
      </svg>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="输入部署时设置的密码"
        autocomplete="current-password"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        enterkeyhint="go"
        required>
      <button type="button" class="auth-eye" id="togglePwd" aria-label="显示密码" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M2.6 12S6.4 5.8 12 5.8s9.4 6.2 9.4 6.2-3.8 6.2-9.4 6.2S2.6 12 2.6 12z" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="12" cy="12" r="2.7" fill="none" stroke="currentColor" stroke-width="1.7"/>
        </svg>
      </button>
    </div>

    <p class="auth-error" id="authError" hidden></p>

    <button type="submit" class="auth-submit" id="submitBtn">
      <span class="auth-submit-text">进入</span>
      <svg class="auth-arrow" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M5 12h13M12.5 5.8 19 12l-6.5 6.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>

    <p class="auth-foot">
      密码由部署者在环境变量 <code>APP_PASSWORD</code> 里设置。<br>
      登录状态保留 30 天，换密码后需要重新登录。
    </p>
  </form>
</main>

<script>
(function () {
  const form = document.getElementById('loginForm');
  const input = document.getElementById('password');
  const errorBox = document.getElementById('authError');
  const submitBtn = document.getElementById('submitBtn');
  const toggle = document.getElementById('togglePwd');

  toggle.addEventListener('click', () => {
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    toggle.setAttribute('aria-pressed', String(!showing));
    toggle.setAttribute('aria-label', showing ? '显示密码' : '隐藏密码');
    input.focus();
    if (input.value) input.setSelectionRange(input.value.length, input.value.length);
  });

  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
    form.classList.remove('is-shake');
    void form.offsetWidth;
    form.classList.add('is-shake');
    input.focus();
    input.select();
  }

  function clearError() {
    errorBox.hidden = true;
    errorBox.textContent = '';
  }

  input.addEventListener('input', clearError);

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const password = input.value.trim();
    if (!password) {
      showError('请输入密码');
      return;
    }

    submitBtn.disabled = true;
    form.classList.add('is-busy');
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showError(data.error || '登录失败，请重试');
        return;
      }
      window.location.replace('/');
    } catch (err) {
      showError('网络不太通，再试一次');
    } finally {
      submitBtn.disabled = false;
      form.classList.remove('is-busy');
    }
  });
})();
</script>
</body>
</html>
